<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK SWASTA ASSISI - Portal Akademik Terpadu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Generator & Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#e3242b', primaryDark: '#b91c22', surface: '#f8fafc' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- Custom CSS Terpisah -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <!-- ================= 1. HALAMAN LOGIN ================= -->
    <div id="view-login" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 fade-in">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-primary">
            <div class="text-center mb-8">
                <div class="bg-primary text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">
                    <i class="fas fa-school"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">SMK SWASTA ASSISI</h2>
                <p class="text-slate-500 text-sm mt-1">SELAMAT DATANG DI Sistem SMK SWASTA ASSISI</p>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">PERAN AKSES</label>
                    <select id="login-role" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                        <option value="Siswa">SISWA/I</option>
                        <option value="Guru">GURU</option>
                        <option value="Admin">ADMIN</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">USERNAME</label>
                    <input type="text" id="login-username" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan NAMA/NIS/NIP">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">PASSWORD</label>
                    <input type="password" id="login-Password" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan PASSWORD">
                </div>
                <button onclick="prosesLogin()" class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition duration-200">
                    LOGIN
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. SIDEBAR ================= -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm hidden-section z-20 h-full">
        <div class="p-5 border-b border-slate-100 flex items-center gap-3">
            <div class="bg-primary text-white p-2 rounded-lg"><i class="fas fa-graduation-cap"></i></div>
            <div>
                <h1 class="font-bold text-slate-800 leading-tight">SMK ASSISI</h1>
                <span id="badge-role" class="text-[10px] font-bold bg-slate-100 text-primary px-2 py-0.5 rounded-full uppercase tracking-wider">ROLE</span>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1.5" id="nav-menu">
            <!-- Nav buttons generated via JS based on role -->
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-bold"><i class="fas fa-user"></i></div>
                <div class="overflow-hidden">
                    <p id="display-name" class="text-sm font-bold text-slate-800 truncate">User</p>
                </div>
            </div>
            <button onclick="prosesLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-bold rounded-lg text-white bg-slate-800 hover:bg-slate-900 transition-colors">
                <i class="fas fa-power-off"></i> KELUAR
            </button>
        </div>
    </aside>

    <!-- ================= 3. MAIN CONTENT ================= -->
    <main id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden hidden-section bg-slate-50">
        <!-- TOPBAR PERINGATAN UJIAN + JAM BERJALAN & SISA WAKTU -->
        <div id="topbar-warning" class="hidden-section bg-primary text-white px-6 py-3 flex flex-wrap justify-between items-center gap-3 shadow-md z-10">
            <div class="font-bold flex items-center gap-2">
                <i class="fas fa-shield-alt animate-pulse"></i>
                <span>MODE UJIAN AKTIF (ANTI-CHEAT)</span>
                <span id="exam-active-mapel" class="text-xs bg-white text-primary px-2 py-0.5 rounded font-extrabold">MAPEL</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-900/60 px-3 py-1.5 rounded-lg border border-white/20 flex items-center gap-2">
                    <i class="far fa-clock text-amber-300"></i>
                    <div class="text-xs leading-tight">
                        <span class="block text-[10px] text-slate-200 uppercase">Jam Sekarang</span>
                        <span id="live-clock-display" class="font-mono font-bold text-sm">00:00:00</span>
                    </div>
                </div>
                <div class="bg-black/30 px-4 py-1.5 rounded-lg border border-white/30 flex items-center gap-2">
                    <i class="fas fa-hourglass-half text-red-200 animate-spin"></i>
                    <div class="text-xs leading-tight">
                        <span class="block text-[10px] text-red-100 uppercase">Sisa Waktu</span>
                        <span id="timer-display" class="font-mono font-bold text-lg">00:00:00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6" id="content-area">
            <!-- Tempat Konten Menu Dirender -->
        </div>
    </main>

    <!-- ================= MODUL JAVASCRIPT TERPISAH ================= -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/qr-presensi.js"></script>
    <script src="js/tugas-catatan.js"></script>
    <script src="js/jadwal-materi.js"></script>
    <script src="js/cbt-ujian.js"></script>
</body>
</html>
